[project]
name = "iot"
version = "0.1.0"
description = "NgậpSense IoT water monitoring project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "paho-mqtt>=2.1.0",
    "psycopg[binary]>=3,<4",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2,<3",
    "streamlit>=1.66.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
